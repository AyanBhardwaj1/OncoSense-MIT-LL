<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">OncoSense Band — wiring</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Reference build: Adafruit QT Py SAMD21 + Adafruit AS7341 (STEMMA QT) + two LEDs</text>

  <!-- QT Py -->
  <rect x="360" y="160" width="240" height="250" rx="12" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="480" y="188" text-anchor="middle" font-weight="bold" fill="#312e81">Adafruit QT Py (SAMD21)</text>
  <text x="480" y="206" text-anchor="middle" font-size="12" fill="#4b5563">outer face of band</text>
  <g font-size="13" fill="#111827">
    <text x="372" y="244">A1</text>
    <text x="372" y="294">A2</text>
    <text x="372" y="344">GND</text>
    <text x="588" y="244" text-anchor="end">STEMMA QT</text>
    <text x="588" y="344" text-anchor="end">USB-C / 5V</text>
    <text x="588" y="384" text-anchor="end">GND</text>
  </g>

  <!-- AS7341 -->
  <rect x="700" y="170" width="220" height="140" rx="12" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
  <text x="810" y="198" text-anchor="middle" font-weight="bold" fill="#155e75">Adafruit AS7341</text>
  <text x="810" y="216" text-anchor="middle" font-size="12" fill="#4b5563">10-ch spectral sensor, faces skin</text>
  <text x="810" y="250" text-anchor="middle" font-size="12" fill="#111827">F1–F8 (415–680 nm), Clear, NIR</text>
  <text x="810" y="270" text-anchor="middle" font-size="12" fill="#111827">I²C 0x39 · on-board white LED</text>
  <path d="M600 240 H700" stroke="#0e7490" stroke-width="4"/>
  <text x="650" y="230" text-anchor="middle" font-size="11" fill="#0e7490">4-pin JST SH</text>
  <text x="650" y="260" text-anchor="middle" font-size="11" fill="#0e7490">3V · GND</text>
  <text x="650" y="274" text-anchor="middle" font-size="11" fill="#0e7490">SDA · SCL</text>

  <!-- NIR LED -->
  <rect x="40" y="200" width="200" height="80" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="140" y="228" text-anchor="middle" font-weight="bold" fill="#7f1d1d">850 nm NIR LED</text>
  <text x="140" y="246" text-anchor="middle" font-size="12" fill="#4b5563">EPIGAP OSA star module</text>
  <text x="140" y="264" text-anchor="middle" font-size="12" fill="#4b5563">3D-printed mount, faces skin</text>
  <path d="M360 240 H300" stroke="#b91c1c" stroke-width="2.5"/>
  <rect x="268" y="230" width="32" height="20" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="284" y="222" text-anchor="middle" font-size="11">R1</text>
  <path d="M268 240 H240" stroke="#b91c1c" stroke-width="2.5"/>

  <!-- Red LED -->
  <rect x="40" y="300" width="200" height="60" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="140" y="326" text-anchor="middle" font-weight="bold" fill="#7c2d12">660 nm red LED</text>
  <text x="140" y="344" text-anchor="middle" font-size="12" fill="#4b5563">hydration channel (F8)</text>
  <path d="M360 290 H320 V330 H300" stroke="#c2410c" stroke-width="2.5" fill="none"/>
  <rect x="268" y="320" width="32" height="20" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="284" y="312" text-anchor="middle" font-size="11">R2</text>
  <path d="M268 330 H240" stroke="#c2410c" stroke-width="2.5"/>

  <!-- LED grounds -->
  <path d="M140 280 V292 M140 360 V440 H420 V344 H392" stroke="#111827" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
  <text x="250" y="458" text-anchor="middle" font-size="12" fill="#374151">LED cathodes → GND</text>

  <!-- Battery -->
  <rect x="700" y="350" width="220" height="80" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="810" y="378" text-anchor="middle" font-weight="bold" fill="#14532d">Battery pack</text>
  <text x="810" y="396" text-anchor="middle" font-size="12" fill="#4b5563">sleeve pocket, JST connector</text>
  <text x="810" y="414" text-anchor="middle" font-size="12" fill="#4b5563">or USB power while logging</text>
  <path d="M700 375 H650 V340 H600" stroke="#15803d" stroke-width="2.5" fill="none"/>
  <path d="M700 400 H640 V380 H600" stroke="#111827" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
  <text x="660" y="332" font-size="11" fill="#15803d">+5V</text>

  <!-- notes -->
  <g font-size="12" fill="#374151">
    <text x="40" y="500">R1, R2: series current-limiting resistors sized from each LED's forward voltage, keeping current within the GPIO limit (~7 mA on SAMD21).</text>
    <text x="40" y="520">For more optical power, switch the LED through an NPN transistor or logic-level MOSFET and raise the current.</text>
    <text x="40" y="540">LEDs and the AS7341 sit side by side on the inner face of the band; the QT Py and battery stay on the outer face.</text>
  </g>
</svg>
